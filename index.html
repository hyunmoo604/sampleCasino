<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>접근 제한 안내</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- IP 차단 폐쇄 안내 카드 (로고 및 게임 요소 제거됨) -->
    <div class="max-w-md w-full bg-slate-900 border border-red-500/30 rounded-2xl p-8 text-center shadow-2xl flex flex-col items-center gap-4">
        
        <!-- 경고 아이콘 -->
        <div class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-500 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
        </div>

        <!-- 안내 문구 -->
        <h1 class="text-xl font-bold text-red-400">해당 IP는 차단당하셨습니다.</h1>
        <p class="text-xs text-slate-400 leading-relaxed">
            비정상적인 접근 또는 이용약관 위반으로 인해 해당 IP 주소에서의 접속이 거부되었습니다.<br>
            문의 사항이 있으신 경우 관리자에게 연락해 주시기 바랍니다.
        </p>

        <!-- 구분선 및 상태 정보 -->
        <div class="w-full border-t border-slate-800 pt-4 mt-2 flex flex-col gap-1 text-[11px] text-slate-500">
            <div>ERR_ACCESS_DENIED_BY_IP</div>
            <div>STATUS: CLOSED</div>
        </div>

    </div>

</body>
</html>
